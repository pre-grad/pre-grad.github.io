<style>
/* =====================================================================
   NOTION DARK · token system
   ===================================================================== */
:root {
  /* surface */
  --bg:           rgb(25, 25, 25);
  --bg-sidebar:   rgb(32, 32, 32);
  --bg-modal:     rgb(37, 37, 37);
  --bg-hover:     rgba(255,255,255,0.055);
  --bg-hover-soft: rgba(255,255,255,0.028);
  --bg-active:    rgba(255,255,255,0.08);
  --bg-input:     rgba(255,255,255,0.055);

  /* lines */
  --line:         rgba(255,255,255,0.094);
  --line-strong:  rgba(255,255,255,0.13);

  /* ink */
  --ink:          rgba(255,255,255,0.81);
  --ink-strong:   rgb(255,255,255);
  --ink-mute:     rgba(255,255,255,0.443);
  --ink-fade:     rgba(255,255,255,0.282);

  /* accent */
  --accent:       rgb(35, 131, 226);
  --accent-soft:  rgba(35,131,226,0.28);

  /* tag palette · Notion's actual values */
  --c-gray-fg:   rgba(255,255,255,0.6);
  --c-gray-bg:   rgba(255,255,255,0.07);
  --c-red-fg:    rgb(255,115,105);
  --c-red-bg:    rgba(255,115,105,0.16);
  --c-orange-fg: rgb(255,163,68);
  --c-orange-bg: rgba(255,163,68,0.16);
  --c-yellow-fg: rgb(255,220,73);
  --c-yellow-bg: rgba(255,220,73,0.13);
  --c-green-fg:  rgb(77,171,154);
  --c-green-bg:  rgba(77,171,154,0.16);
  --c-blue-fg:   rgb(82,156,202);
  --c-blue-bg:   rgba(82,156,202,0.16);
  --c-purple-fg: rgb(157,114,217);
  --c-purple-bg: rgba(157,114,217,0.16);
  --c-pink-fg:   rgb(228,118,164);
  --c-pink-bg:   rgba(228,118,164,0.16);
  --c-brown-fg:  rgb(160,109,79);
  --c-brown-bg:  rgba(160,109,79,0.16);

  --r-sm: 3px;
  --r:    4px;
  --r-md: 6px;
  --r-lg: 8px;

  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
  --font-mono: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden; /* shell scrolls internally */
}

button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; padding: 0; }
input, select, textarea { font: inherit; color: inherit; background: none; border: none; outline: none; }

/* ----- selection ----- */
::selection { background: rgba(35,131,226,0.4); color: var(--ink-strong); }

/* ----- scrollbar ----- */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.08);
  border-radius: 99px;
  border: 3px solid transparent;
  background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); background-clip: padding-box; border: 3px solid transparent; }

/* =====================================================================
   shell
   ===================================================================== */
.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  height: 100vh;
}

/* =====================================================================
   sidebar
   ===================================================================== */
.sidebar {
  background: var(--bg-sidebar);
  display: flex; flex-direction: column;
  overflow-y: auto;
  user-select: none;
  border-right: 1px solid var(--line);
}

.sb-top {
  padding: 8px 6px;
}
.sb-workspace {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; margin: 0 4px;
  border-radius: var(--r);
  cursor: pointer;
}
.sb-workspace:hover { background: var(--bg-hover); }
.sb-workspace .icon {
  width: 22px; height: 22px;
  border-radius: var(--r-sm);
  background: linear-gradient(135deg, #2b2b2b, #1f1f1f);
  border: 1px solid var(--line-strong);
  display: grid; place-items: center;
  font-size: 13px;
}
.sb-workspace .name {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sb-workspace .chev {
  color: var(--ink-fade);
  font-size: 12px;
}

.sb-actions {
  padding: 4px 8px 8px;
}
.sb-action {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 8px;
  border-radius: var(--r);
  color: var(--ink-mute);
  font-size: 14px;
  width: 100%;
  text-align: left;
  cursor: pointer;
}
.sb-action:hover { background: var(--bg-hover); color: var(--ink); }
.sb-action .ic {
  width: 18px; height: 18px;
  display: grid; place-items: center;
  font-size: 13px;
  flex-shrink: 0;
  color: var(--ink-fade);
}

.sb-section-label {
  padding: 12px 14px 4px;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-fade);
  letter-spacing: 0.02em;
  text-transform: none;
}

.sb-tree { padding: 0 6px 12px; }
.sb-page {
  position: relative;
  padding-left: var(--depth, 8px);
}
.sb-page-row {
  display: flex; align-items: center; gap: 0;
  padding: 4px 8px 4px 0;
  border-radius: var(--r);
  cursor: pointer;
  margin: 1px 4px 1px 0;
  position: relative;
}
.sb-page-row:hover { background: var(--bg-hover); }
.sb-page-row.active { background: var(--bg-active); }
.sb-page-row.active .sb-page-name { color: var(--ink-strong); font-weight: 500; }

.sb-chev {
  width: 18px; height: 22px;
  display: grid; place-items: center;
  flex-shrink: 0;
  border-radius: var(--r-sm);
  color: var(--ink-fade);
  opacity: 0;
  transition: transform 0.14s ease, opacity 0.1s;
}
.sb-page-row:hover .sb-chev { opacity: 1; }
.sb-chev.has-children { opacity: 1; }
.sb-chev.expanded { transform: rotate(90deg); }
.sb-chev:hover { background: var(--bg-hover); }
.sb-chev::before { content: '▸'; font-size: 9px; }
.sb-page-emoji {
  width: 22px; height: 22px;
  display: grid; place-items: center;
  font-size: 14px;
  flex-shrink: 0;
}
.sb-page-name {
  font-size: 14px;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  padding: 0 2px;
}
.sb-page-actions {
  display: flex; gap: 1px;
  opacity: 0;
  flex-shrink: 0;
}
.sb-page-row:hover .sb-page-actions { opacity: 1; }
.sb-page-act {
  width: 22px; height: 22px;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  color: var(--ink-fade);
  font-size: 14px;
}
.sb-page-act:hover { background: var(--bg-hover); color: var(--ink); }

.sb-children { display: none; }
.sb-children.expanded { display: block; }

.sb-bottom {
  margin-top: auto;
  padding: 8px 14px 14px;
  font-size: 11px;
  color: var(--ink-fade);
  line-height: 1.6;
}
.sb-bottom code {
  font-family: var(--font-mono);
  font-size: 10px;
  background: var(--bg-input);
  padding: 1px 4px;
  border-radius: 2px;
}

/* =====================================================================
   main
   ===================================================================== */
.main {
  display: flex; flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

/* topbar */
.topbar {
  height: 44px;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center;
  padding: 0 14px;
  gap: 12px;
  flex-shrink: 0;
}
.crumbs { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-mute); flex: 1; min-width: 0; }
.crumb { display: flex; align-items: center; gap: 4px; padding: 3px 6px; border-radius: var(--r); cursor: pointer; }
.crumb:hover { background: var(--bg-hover); color: var(--ink); }
.crumb.last { color: var(--ink); }
.crumb-sep { color: var(--ink-fade); font-size: 12px; }
.topbar-actions { display: flex; gap: 4px; }
.topbar-btn {
  height: 28px; padding: 0 8px;
  border-radius: var(--r);
  display: flex; align-items: center; gap: 4px;
  color: var(--ink-mute);
  font-size: 13px;
}
.topbar-btn:hover { background: var(--bg-hover); color: var(--ink); }

/* page scroll container */
.page-scroll {
  flex: 1;
  overflow-y: auto;
  position: relative;
}
.page {
  max-width: 900px;
  margin: 0 auto;
  padding: 48px 96px 200px;
  display: none;
}
.page.active { display: block; }
@media (max-width: 900px) { .page { padding: 32px 32px 200px; } }

/* page header */
.ph-emoji {
  font-size: 78px;
  line-height: 1;
  margin-bottom: 8px;
  display: block;
}
.ph-title {
  font-size: 40px;
  font-weight: 700;
  letter-spacing: -0.018em;
  line-height: 1.2;
  color: var(--ink-strong);
  outline: none;
  word-break: break-word;
  margin-bottom: 8px;
}
.ph-title:empty::before {
  content: attr(data-placeholder);
  color: var(--ink-fade);
}
.ph-meta {
  display: flex; align-items: center; gap: 14px;
  margin: 12px 0 4px;
  flex-wrap: wrap;
  font-size: 13px;
}
.ph-meta-row {
  display: flex; align-items: center; gap: 8px;
  color: var(--ink-mute);
}
.ph-meta-row .label {
  width: 130px;
  color: var(--ink-mute);
  font-size: 13px;
  display: flex; align-items: center; gap: 6px;
}

/* dividers between hero and body */
.page-divider {
  height: 1px;
  background: var(--line);
  margin: 18px 0 14px;
}

/* =====================================================================
   blocks
   ===================================================================== */
.block {
  position: relative;
  padding: 3px 2px;
  margin: 1px 0;
  border-radius: var(--r);
}
.block:hover .block-handle { opacity: 1; }
.block-handle {
  position: absolute;
  left: -32px; top: 4px;
  display: flex; gap: 0;
  opacity: 0;
  transition: opacity 0.1s;
}
.bh-btn {
  width: 22px; height: 22px;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  color: var(--ink-fade);
  font-size: 14px;
}
.bh-btn:hover { background: var(--bg-hover); color: var(--ink); }

.block.text { font-size: 16px; line-height: 1.55; padding: 4px 2px; color: var(--ink); }
.block.text[contenteditable]:empty::before {
  content: attr(data-placeholder);
  color: var(--ink-fade);
}

.block.h2 {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 28px 0 4px;
  padding: 2px 2px;
  color: var(--ink-strong);
  line-height: 1.3;
}
.block.h3 {
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -0.005em;
  margin: 18px 0 2px;
  padding: 2px 2px;
  color: var(--ink-strong);
  line-height: 1.3;
}

/* todo block */
.block.todo {
  display: flex; align-items: flex-start; gap: 6px;
  padding: 4px 2px;
}
.block.todo .checkbox {
  width: 16px; height: 16px; flex-shrink: 0;
  border-radius: 3px;
  border: 1.2px solid var(--ink-mute);
  margin-top: 4px;
  cursor: pointer;
  display: grid; place-items: center;
  background: transparent;
  transition: all 0.1s;
}
.block.todo .checkbox:hover { border-color: var(--ink-strong); }
.block.todo .checkbox.checked {
  background: var(--accent);
  border-color: var(--accent);
}
.block.todo .checkbox.checked::after {
  content: '';
  display: block;
  width: 4px; height: 8px;
  border: solid white;
  border-width: 0 1.5px 1.5px 0;
  transform: rotate(45deg) translate(-1px,-1px);
}
.block.todo .todo-text {
  font-size: 15px;
  line-height: 1.55;
  flex: 1;
  outline: none;
}
.block.todo.done .todo-text {
  color: var(--ink-fade);
  text-decoration: line-through;
}
.todo-row-meta {
  display: flex; gap: 4px; align-items: center;
  flex-wrap: wrap;
  margin-top: 2px;
}

/* toggle block */
.block.toggle {
  padding: 0;
}
.toggle-head {
  display: flex; align-items: flex-start; gap: 4px;
  padding: 4px 2px;
  cursor: pointer;
}
.toggle-chev {
  width: 22px; height: 22px;
  display: grid; place-items: center;
  flex-shrink: 0;
  border-radius: var(--r-sm);
  color: var(--ink-mute);
  font-size: 11px;
  margin-top: 1px;
  transition: transform 0.14s;
}
.toggle-head:hover .toggle-chev { background: var(--bg-hover); }
.toggle.expanded .toggle-chev { transform: rotate(90deg); }
.toggle-chev::before { content: '▸'; }
.toggle-title {
  font-size: 16px;
  line-height: 1.55;
  flex: 1;
  font-weight: 500;
}
.toggle-children {
  display: none;
  padding-left: 26px;
}
.toggle.expanded > .toggle-children { display: block; }

/* bullet list */
.block.bullet {
  display: flex; align-items: flex-start; gap: 4px;
  padding: 3px 2px;
  font-size: 15px; line-height: 1.55;
}
.block.bullet::before {
  content: '•';
  width: 22px; flex-shrink: 0;
  text-align: center;
  color: var(--ink);
  margin-top: 1px;
}
.block.bullet .b-text { flex: 1; }

/* numbered list */
.block.num {
  display: flex; align-items: flex-start; gap: 4px;
  padding: 3px 2px;
  font-size: 15px; line-height: 1.55;
}
.block.num .num-marker {
  width: 22px; flex-shrink: 0;
  text-align: right;
  padding-right: 4px;
  color: var(--ink);
}

/* callout */
.block.callout {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px;
  background: rgba(255,255,255,0.03);
  border-radius: var(--r-md);
  margin: 4px 0;
  border: 1px solid var(--line);
}
.block.callout .callout-icon {
  font-size: 18px;
  line-height: 1.4;
  flex-shrink: 0;
}
.block.callout.warn { background: var(--c-orange-bg); border-color: rgba(255,163,68,0.3); color: var(--c-orange-fg); }
.block.callout.danger { background: var(--c-red-bg); border-color: rgba(255,115,105,0.3); color: var(--c-red-fg); }
.block.callout.info { background: var(--c-blue-bg); border-color: rgba(82,156,202,0.3); color: var(--c-blue-fg); }
.block.callout.success { background: var(--c-green-bg); border-color: rgba(77,171,154,0.3); color: var(--c-green-fg); }
.block.callout .callout-body { color: var(--ink); flex: 1; }
.block.callout strong { color: var(--ink-strong); }

/* quote */
.block.quote {
  border-left: 3px solid var(--ink-strong);
  padding: 4px 14px;
  font-size: 18px;
  font-style: italic;
  color: var(--ink);
  margin: 6px 0;
}

/* divider */
.block.divider {
  height: 1px;
  background: var(--line);
  margin: 16px 0;
}

/* code */
code.inline {
  font-family: var(--font-mono);
  font-size: 0.85em;
  background: var(--c-red-bg);
  color: var(--c-red-fg);
  padding: 1px 5px;
  border-radius: 3px;
}

/* tags / chips */
.tag {
  display: inline-flex; align-items: center;
  height: 18px;
  padding: 0 6px;
  border-radius: 3px;
  font-size: 12px;
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
  background: var(--c-gray-bg);
  color: var(--c-gray-fg);
}
.tag.gray { background: var(--c-gray-bg); color: var(--c-gray-fg); }
.tag.red { background: var(--c-red-bg); color: var(--c-red-fg); }
.tag.orange { background: var(--c-orange-bg); color: var(--c-orange-fg); }
.tag.yellow { background: var(--c-yellow-bg); color: var(--c-yellow-fg); }
.tag.green { background: var(--c-green-bg); color: var(--c-green-fg); }
.tag.blue { background: var(--c-blue-bg); color: var(--c-blue-fg); }
.tag.purple { background: var(--c-purple-bg); color: var(--c-purple-fg); }
.tag.pink { background: var(--c-pink-bg); color: var(--c-pink-fg); }
.tag.brown { background: var(--c-brown-bg); color: var(--c-brown-fg); }

.tag.ring {
  background: transparent;
  box-shadow: inset 0 0 0 1px currentColor;
}
.tag.lg { height: 22px; padding: 0 8px; font-size: 13px; }

/* =====================================================================
   database UI
   ===================================================================== */
.db-views {
  display: flex; align-items: center; gap: 0;
  border-bottom: 1px solid var(--line);
  margin: 0 0 0;
  padding: 0;
  position: relative;
}
.db-tab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 8px;
  margin-right: 2px;
  border-radius: 0;
  font-size: 14px;
  color: var(--ink-mute);
  cursor: pointer;
  position: relative;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.db-tab:hover { color: var(--ink); }
.db-tab.active {
  color: var(--ink-strong);
  border-bottom-color: var(--ink-strong);
  font-weight: 500;
}
.db-tab .tab-icon { font-size: 14px; opacity: 0.8; }
.db-add-view {
  color: var(--ink-fade);
  padding: 4px 6px;
  border-radius: var(--r);
  font-size: 14px;
  margin-left: 2px;
}
.db-add-view:hover { background: var(--bg-hover); color: var(--ink); }

.db-toolbar {
  display: flex; align-items: center; justify-content: flex-end;
  gap: 4px;
  padding: 8px 0 8px;
  flex-wrap: wrap;
}
.db-toolbar-left { flex: 1; display: flex; gap: 4px; align-items: center; }
.db-tool-btn {
  display: flex; align-items: center; gap: 4px;
  padding: 4px 8px;
  border-radius: var(--r);
  color: var(--ink-mute);
  font-size: 13px;
}
.db-tool-btn:hover { background: var(--bg-hover); color: var(--ink); }
.db-tool-btn.primary {
  background: var(--accent);
  color: white;
  font-weight: 500;
}
.db-tool-btn.primary:hover { background: rgb(28,116,202); color: white; }

/* table view */
.tbl-wrap { overflow-x: auto; padding-bottom: 80px; }
.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.tbl thead th {
  text-align: left;
  font-weight: 500;
  font-size: 12px;
  color: var(--ink-mute);
  padding: 6px 8px;
  border-bottom: 1px solid var(--line);
  border-right: 1px solid var(--line);
  background: var(--bg);
  user-select: none;
  white-space: nowrap;
}
.tbl thead th:first-child { padding-left: 8px; }
.tbl thead th .col-icon { display: inline-block; width: 14px; color: var(--ink-fade); margin-right: 4px; }
.tbl tbody td {
  padding: 7px 8px;
  border-bottom: 1px solid var(--line);
  border-right: 1px solid var(--line);
  vertical-align: top;
}
.tbl tbody tr:hover td { background: var(--bg-hover-soft); }
.tbl tbody tr.done td { color: var(--ink-mute); }
.tbl tbody tr.done td .cell-title-text { text-decoration: line-through; color: var(--ink-mute); }
.tbl tbody tr.overdue td:first-child { box-shadow: inset 2px 0 0 var(--c-red-fg); }

.cell-title { display: flex; align-items: center; gap: 6px; min-width: 280px; }
.cell-title .checkbox-wrap { flex-shrink: 0; }
.cell-title .checkbox {
  width: 14px; height: 14px;
  border-radius: 3px;
  border: 1.2px solid var(--ink-mute);
  display: grid; place-items: center;
  cursor: pointer;
  background: transparent;
}
.cell-title .checkbox:hover { border-color: var(--ink-strong); }
.cell-title .checkbox.checked { background: var(--accent); border-color: var(--accent); }
.cell-title .checkbox.checked::after {
  content: '';
  width: 3.5px; height: 6px;
  border: solid white;
  border-width: 0 1.3px 1.3px 0;
  transform: rotate(45deg) translateY(-1px);
}
.cell-title-text {
  outline: none;
  flex: 1;
  cursor: text;
  border-radius: 2px;
  padding: 1px 2px;
}
.cell-title-text:focus { background: var(--bg-input); }
.cell-empty { color: var(--ink-fade); }

.tbl-add-row {
  padding: 7px 8px;
  color: var(--ink-fade);
  cursor: pointer;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 6px;
  font-size: 13px;
}
.tbl-add-row:hover { background: var(--bg-hover-soft); color: var(--ink); }

/* board view (kanban) */
.board {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 8px 0 80px;
  align-items: flex-start;
  min-height: 400px;
}
.board-col {
  flex-shrink: 0;
  width: 260px;
  background: transparent;
  border-radius: var(--r-md);
}
.board-col-h {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 6px 8px;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
}
.board-col-h .count { color: var(--ink-fade); font-weight: 400; font-size: 13px; }
.board-col-h .spacer { flex: 1; }
.board-col-h .add {
  width: 22px; height: 22px;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  color: var(--ink-fade);
  font-size: 14px;
}
.board-col-h .add:hover { background: var(--bg-hover); color: var(--ink); }

.board-cards { display: flex; flex-direction: column; gap: 6px; min-height: 40px; }
.card {
  background: rgb(37,37,37);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 8px 10px;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(0,0,0,0.2);
}
.card:hover { background: rgb(45,45,45); }
.card-title {
  font-size: 14px;
  line-height: 1.4;
  color: var(--ink);
  margin-bottom: 6px;
}
.card-meta { display: flex; gap: 4px; flex-wrap: wrap; }

.board-add-col {
  flex-shrink: 0;
  width: 200px;
  padding: 8px 6px;
  color: var(--ink-fade);
  font-size: 14px;
  cursor: pointer;
  border-radius: var(--r);
}
.board-add-col:hover { background: var(--bg-hover); color: var(--ink); }

/* calendar view */
.cal {
  margin: 0 0 80px;
}
.cal-h {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 0 14px;
  font-size: 16px;
  font-weight: 600;
}
.cal-h .month { font-size: 16px; font-weight: 600; color: var(--ink-strong); }
.cal-h .nav-btn {
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border-radius: var(--r);
  color: var(--ink-mute);
  font-size: 14px;
}
.cal-h .nav-btn:hover { background: var(--bg-hover); color: var(--ink); }
.cal-h .today-btn {
  margin-left: 4px;
  padding: 4px 10px;
  border-radius: var(--r);
  border: 1px solid var(--line-strong);
  font-size: 13px;
  color: var(--ink-mute);
}
.cal-h .today-btn:hover { background: var(--bg-hover); color: var(--ink); }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border-top: 1px solid var(--line);
  border-left: 1px solid var(--line);
}
.cal-dow {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-mute);
  padding: 6px 8px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--bg);
}
.cal-day {
  min-height: 100px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 4px 6px;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}
.cal-day.muted { background: rgb(22,22,22); }
.cal-day.muted .day-num { color: var(--ink-fade); }
.cal-day.today .day-num {
  background: var(--accent);
  color: white;
  width: 22px; height: 22px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-weight: 600;
  font-size: 13px;
}
.day-num {
  font-size: 13px;
  color: var(--ink);
  margin-bottom: 4px;
  display: inline-block;
  padding: 2px 4px;
}
.cal-pill {
  display: block;
  font-size: 12px;
  padding: 2px 6px;
  margin: 2px 0;
  border-radius: 3px;
  background: var(--c-gray-bg);
  color: var(--c-gray-fg);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}
.cal-pill.cv { background: var(--c-pink-bg); color: var(--c-pink-fg); }
.cal-pill.aws { background: var(--c-orange-bg); color: var(--c-orange-fg); }
.cal-pill.deploy { background: var(--c-green-bg); color: var(--c-green-fg); }
.cal-pill.apps { background: var(--c-purple-bg); color: var(--c-purple-fg); }
.cal-pill.coding { background: var(--c-blue-bg); color: var(--c-blue-fg); }
.cal-pill.planning { background: var(--c-gray-bg); color: var(--c-gray-fg); }
.cal-pill.travel { background: var(--c-yellow-bg); color: var(--c-yellow-fg); }
.cal-pill.done { opacity: 0.5; text-decoration: line-through; }

/* =====================================================================
   Today page specific
   ===================================================================== */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 18px 0 6px;
}
@media (max-width: 700px) { .stats-row { grid-template-columns: 1fr 1fr; } }

.stat {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 10px 12px;
}
.stat .lbl {
  font-size: 12px;
  color: var(--ink-mute);
  margin-bottom: 4px;
}
.stat .val {
  font-size: 24px;
  font-weight: 600;
  color: var(--ink-strong);
  letter-spacing: -0.01em;
}
.stat .val .unit { font-size: 12px; color: var(--ink-mute); font-weight: 400; margin-left: 3px; }

/* outcome card on Mission */
.outcome {
  background: rgba(255,255,255,0.025);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 16px 18px;
  margin: 8px 0;
}
.outcome-h {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
}
.outcome-name {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink-strong);
  letter-spacing: -0.005em;
}
.outcome-deadline {
  font-size: 12px;
  color: var(--ink-mute);
  margin-top: 2px;
}
.bar {
  height: 6px;
  background: rgba(255,255,255,0.08);
  border-radius: 99px;
  position: relative;
  overflow: visible;
}
.bar .fill {
  height: 100%;
  border-radius: 99px;
  background: var(--accent);
  transition: width 0.4s cubic-bezier(0.2,0.8,0.2,1);
}
.bar .target {
  position: absolute;
  top: -3px;
  width: 2px; height: 12px;
  background: var(--ink-mute);
  opacity: 0.7;
}
.bar.cv .fill { background: var(--c-pink-fg); }
.bar.aws .fill { background: var(--c-orange-fg); }
.bar.deploy .fill { background: var(--c-green-fg); }
.bar.apps .fill { background: var(--c-purple-fg); }

.bar-meta {
  display: flex; justify-content: space-between;
  margin-top: 6px;
  font-size: 12px;
  color: var(--ink-mute);
}
.bar-meta strong { color: var(--ink); font-weight: 600; }
